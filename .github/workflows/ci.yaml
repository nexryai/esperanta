name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -trimpath -o bin/esperanta ./cmd/esperanta
      - run: ./bin/esperanta --config config.yaml --check

  landlock:
    name: Non-Snap Landlock (CGO=${{ matrix.cgo }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        cgo: ['0', '1']
    env:
      CGO_ENABLED: ${{ matrix.cgo }}
      ESPERANTA_REQUIRE_LANDLOCK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Require unprivileged execution outside Snap
        run: |
          test "$(id -u)" -ne 0
          test -z "${SNAP:-}"
      - name: Kernel allow and deny tests, including existing threads
        run: go test -count=1 -v ./internal/landlock
      - name: Proxy HTTP, TLS, DNS, CONNECT and fail-closed startup
        run: go test -count=1 -tags=integration -v ./cmd/esperanta

  snap:
    runs-on: ubuntu-24.04
    needs: [test, landlock]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: snapcore/action-build@b391f430cb2650fd359ed4d2cfe88b2c481800e0 # v1
        id: build
      - name: Install confined snap
        run: sudo snap install --dangerous "${{ steps.build.outputs.snap }}"
      - name: Verify service identity and confinement
        run: bash scripts/check-snap.sh
      - name: Service logs
        if: always()
        run: sudo snap logs esperanta.esperanta || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: esperanta-snap
          path: ${{ steps.build.outputs.snap }}
      - name: Publish to edge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: canonical/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.STORE_LOGIN }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: edge
