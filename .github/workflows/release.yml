name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.4)'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    name: Build release archives and Debian packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Linux binaries
        run: |
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 \
              go build -buildvcs=false -trimpath -ldflags='-s -w' \
              -o "esperanta-$arch" ./cmd/esperanta
          done

      - name: Build Debian packages
        run: |
          version="${RELEASE_TAG#v}"
          packaging/deb/build-deb.sh amd64 esperanta-amd64 "$version" dist
          packaging/deb/build-deb.sh arm64 esperanta-arm64 "$version" dist

      - name: Compress binaries
        run: |
          for arch in amd64 arm64; do
            zip -j "esperanta-linux-$arch.zip" "esperanta-$arch"
          done

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              esperanta-linux-*.zip dist/*.deb --clobber
          else
            gh release create "$RELEASE_TAG" \
              --title "Esperanta $RELEASE_TAG" \
              --generate-notes \
              esperanta-linux-*.zip dist/*.deb
          fi

  arch:
    name: Build Arch package (${{ matrix.arch }})
    needs: release
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - aarch64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Build package
        run: |
          version="${RELEASE_TAG#v}"
          docker run --rm \
            --volume "$PWD:/work" \
            --workdir /work \
            archlinux:latest \
            bash -c "pacman -Syu --noconfirm --needed base-devel go curl git >/dev/null && packaging/arch/build.sh '$version' '${{ matrix.arch }}' dist"

      - name: Upload package to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(dist/*.pkg.tar.zst)
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber

  packaging:
    name: Update packaging metadata
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update PKGBUILD, .SRCINFO and spec
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG#v}"
          pkgver="${tag//-/_}"
          url="https://github.com/nexryai/esperanta/archive/refs/tags/v${tag}.tar.gz"

          tmp="$(mktemp)"
          curl -fsSL --retry 3 "$url" -o "$tmp"
          sha="$(sha256sum "$tmp" | cut -d' ' -f1)"
          rm -f "$tmp"

          sed -E -i \
            -e "s/^pkgver=.*/pkgver=${pkgver}/" \
            -e "s/^pkgrel=.*/pkgrel=1/" \
            -e "s/^sha256sums=.*/sha256sums=('${sha}')/" \
            -e "s|^source=.*|source=(\"esperanta-${pkgver}.tar.gz::${url}\")|" \
            packaging/arch/PKGBUILD

          docker run --rm \
            --volume "$PWD/packaging/arch:/src:ro" \
            archlinux:latest \
            bash -c '
              set -e
              id -u builder >/dev/null 2>&1 || useradd -m builder
              mkdir -p /home/builder/pkg
              cp /src/PKGBUILD /home/builder/pkg/
              chown -R builder /home/builder/pkg
              cd /home/builder/pkg
              runuser -u builder -- makepkg --printsrcinfo
            ' > packaging/arch/.SRCINFO

          # Keep the fallback version in the spec in sync. COPR tag builds
          # derive the real version from the tag in .copr/Makefile.
          sed -E -i \
            -e "s/^Version:.*/Version:        ${pkgver}/" \
            -e "s|^Source0:.*|Source0:        https://github.com/nexryai/esperanta/archive/refs/tags/v${tag}.tar.gz|" \
            esperanta.spec

      - name: Commit metadata as a signed commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if git diff --quiet -- packaging/arch/PKGBUILD packaging/arch/.SRCINFO esperanta.spec; then
            echo "packaging metadata is already up to date"
            exit 0
          fi

          pkgbuild=$(base64 -w0 packaging/arch/PKGBUILD)
          srcinfo=$(base64 -w0 packaging/arch/.SRCINFO)
          spec=$(base64 -w0 esperanta.spec)

          # createCommitOnBranch creates a commit signed by GitHub, which is
          # required because main requires signed commits.
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            head=$(git rev-parse origin/main)

            payload=$(jq -n \
              --arg repo "$GITHUB_REPOSITORY" \
              --arg branch "main" \
              --arg headline "chore: update packaging for ${RELEASE_TAG} [skip ci]" \
              --arg head "$head" \
              --arg pkgbuild "$pkgbuild" \
              --arg srcinfo "$srcinfo" \
              --arg spec "$spec" \
              '{
                query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid url } } }",
                variables: {
                  input: {
                    branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                    message: {headline: $headline},
                    fileChanges: {
                      additions: [
                        {path: "packaging/arch/PKGBUILD", contents: $pkgbuild},
                        {path: "packaging/arch/.SRCINFO", contents: $srcinfo},
                        {path: "esperanta.spec", contents: $spec}
                      ]
                    },
                    expectedHeadOid: $head
                  }
                }
              }')

            response=$(curl -sS \
              -H "Authorization: bearer ${GH_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "$payload" \
              https://api.github.com/graphql)

            if echo "$response" | jq -e '.data.createCommitOnBranch.commit.oid' >/dev/null 2>&1; then
              echo "Created signed commit: $(echo "$response" | jq -r '.data.createCommitOnBranch.commit.oid')"
              echo "$response" | jq -r '.data.createCommitOnBranch.commit.url'
              exit 0
            fi

            echo "Attempt ${attempt} failed:"
            echo "$response" | jq .
            sleep 5
          done

          echo "Failed to create a signed commit" >&2
          exit 1
