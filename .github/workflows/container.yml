name: Container image

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    name: Test ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and test the container
        run: |
          docker build --tag ghcr.io/nexryai/esperanta:edge .
          docker compose run --rm --pull never esperanta --config /etc/esperanta/config.yaml --check
          docker compose up --detach --pull never
          for attempt in {1..30}; do
            status="$(curl --noproxy '*' --silent --output /dev/null --write-out '%{http_code}' \
              --max-time 1 http://127.0.0.1:8080/ || true)"
            if [[ "$status" == 400 ]] && docker compose logs esperanta | grep -q 'Landlock sandbox enabled'; then
              exit 0
            fi
            sleep 1
          done
          docker compose logs esperanta
          exit 1
      - name: Remove the test container
        if: always()
        run: docker compose down

  push-images:
    if: github.event_name == 'push'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    name: Push ${{ matrix.arch }} image
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Push image by digest
        env:
          ARCH: ${{ matrix.arch }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx create --use
          docker buildx build --platform "linux/$ARCH" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --output "type=image,name=$image,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file "$RUNNER_TEMP/build-metadata.json" .
          mkdir -p "$RUNNER_TEMP/digests"
          jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' \
            "$RUNNER_TEMP/build-metadata.json" > "$RUNNER_TEMP/digests/$ARCH"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: push-images
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Publish multi-architecture tags
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            tags=(--tag "$image:edge")
          else
            tags=(--tag "$image:$GITHUB_REF_NAME")
            if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              tags+=(--tag "$image:latest")
            fi
          fi
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          sources=()
          for arch in amd64 arm64; do
            digest="$(cat "$RUNNER_TEMP/digests/$arch")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            sources+=("$image@$digest")
          done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect --raw "${tags[1]}" |
            jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]'
