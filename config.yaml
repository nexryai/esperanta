# 許可されていない接続元はTCP接続の時点で拒否します。
listen: "127.0.0.1:8080"
allowed_sources:
  - "127.0.0.1"
  - "::1"
  # - "192.168.1.0/24"
  # - "2001:db8:1234::/48"

# HTTPとCONNECTの両方に適用します。
allowed_ports: [80, 443]
# 内部ネットワーク、loopback、link-local等への接続を拒否します。
deny_private_destinations: true

# ホスト名が完全一致するHTTPリクエストだけに追加するヘッダーです。
# CONNECTトンネルには適用されません。グローバルヘッダーは設定できません。
# upstream_headers:
#   api.example.com:
#     Authorization: "Bearer domain-secret"

# listen と同じ IP の別ポートで HTTP を受け、固定の HTTPS ホストへ転送します。
# 接続を許可したクライアントは、ここで設定した認証情報を使って上流へアクセスできます。
# request_target:
#   - port: 8081
#     upstream_host: app.example.com
#     upstream_headers:
#       CF-Access-Client-Id: "<client-id>"
#       CF-Access-Client-Secret: "<client-secret>"

max_concurrent: 1024
max_connections: 2048
max_idle_connections: 1024
max_idle_connections_per_host: 64

dial_timeout: 10s
header_timeout: 10s
request_timeout: 2m
idle_timeout: 90s
# CONNECTトンネルの最大寿命（アイドル時間ではありません）。
tunnel_timeout: 1h
shutdown_timeout: 15s
